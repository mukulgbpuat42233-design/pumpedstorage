<div class="grid report-controls" style="grid-template-columns:1fr 1fr 1fr 1fr">

  <!-- START YEAR -->
  <div class="field">
    <label>Start Year</label>
    <select id="rangeStartYear"></select>
  </div>

  <!-- START MONTH -->
  <div class="field">
    <label>Start Month</label>
    <select id="rangeStartMonth"></select>
  </div>

  <!-- END YEAR -->
  <div class="field">
    <label>End Year</label>
    <select id="rangeEndYear"></select>
  </div>

  <!-- END MONTH -->
  <div class="field">
    <label>End Month</label>
    <select id="rangeEndMonth"></select>
  </div>

  <!-- REPORT MODE -->
  <div class="field">
    <label>Report Mode</label>
    <select id="rangeMode">
      <option value="BASE">BASE</option>
      <option value="SCENARIO">SCENARIO</option>
    </select>
  </div>

  <!-- MARKET SEGMENT -->
  <div class="field">
    <label>Market Segment</label>
    <select id="rangeSegment">
      <option value="DAM">DAM</option>
      <option value="GDAM">GDAM</option>
      <option value="RTM">RTM</option>
      <option value="TAM">TAM</option>
    </select>
  </div>

  <!-- GENERATE -->
  <div class="field">
    <button
      class="custom-report-btn generate"
      id="rangeGenerateBtn">
      📊&nbsp; GENERATE<br>REPORT
    </button>
  </div>

  <!-- PDF -->
  <div class="field">
    <button
      class="custom-report-btn pdf"
      id="rangePdfBtn">
      📄&nbsp; DOWNLOAD<br>PDF
    </button>
  </div>

  <!-- EXCEL -->
  <div class="field">
    <button
      class="custom-report-btn excel"
      id="rangeExcelBtn">
      📗&nbsp; DOWNLOAD<br>EXCEL
    </button>
  </div>

</div>
